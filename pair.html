<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xibu-md | Pair Code</title>

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: #fff;
      background:
        radial-gradient(circle at top, #202020 0%, #0b0b0b 45%, #050505 100%);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      width: 420px;
      height: 420px;
      background: rgba(0, 255, 170, 0.08);
      filter: blur(100px);
      border-radius: 50%;
      top: -150px;
      left: -150px;
      pointer-events: none;
    }

    body::after {
      content: "";
      position: fixed;
      width: 350px;
      height: 350px;
      background: rgba(0, 150, 255, 0.06);
      filter: blur(100px);
      border-radius: 50%;
      bottom: -150px;
      right: -100px;
      pointer-events: none;
    }

    .container {
      width: 100%;
      max-width: 430px;
      display: flex;
      justify-content: center;
      position: relative;
      z-index: 2;
    }

    .box {
      width: 100%;
      padding: 32px 25px 28px;
      position: relative;
      text-align: center;

      background: rgba(20, 20, 20, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;

      box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.65),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      overflow: hidden;
    }

    .box::before {
      content: "";
      position: absolute;
      top: 0;
      left: 10%;
      width: 80%;
      height: 2px;
      background: linear-gradient(
        90deg,
        transparent,
        #00e5a0,
        #00b7ff,
        transparent
      );
      box-shadow: 0 0 20px rgba(0, 229, 160, 0.7);
    }

    .brand-icon {
      width: 68px;
      height: 68px;
      margin: 0 auto 16px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 20px;
      background: linear-gradient(135deg, #00e5a0, #00a8ff);
      color: #07100d;
      font-size: 28px;

      box-shadow:
        0 10px 35px rgba(0, 229, 160, 0.22),
        inset 0 1px 0 rgba(255, 255, 255, 0.35);
    }

    .brand {
      margin: 0;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 2px;

      background: linear-gradient(90deg, #ffffff, #00e5a0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      margin: 7px 0 25px;
      color: #8f9996;
      font-size: 13px;
      letter-spacing: 0.4px;
    }

    .centered-text {
      margin: 0 0 10px;
      color: #fff;
      font-size: 21px;
      font-weight: 700;
    }

    .description {
      margin: 0 0 22px;
      color: #aeb7b4;
      font-size: 13px;
      line-height: 1.6;
    }

    .input-container {
      display: flex;
      width: 100%;
      padding: 5px;
      gap: 5px;

      background: #090909;
      border: 1px solid #272d2b;
      border-radius: 15px;

      box-shadow:
        inset 0 1px 3px rgba(0, 0, 0, 0.8),
        0 8px 25px rgba(0, 0, 0, 0.25);

      transition: 0.25s ease;
    }

    .input-container:focus-within {
      border-color: rgba(0, 229, 160, 0.6);
      box-shadow:
        0 0 0 3px rgba(0, 229, 160, 0.07),
        0 8px 30px rgba(0, 0, 0, 0.3);
    }

    .input-container input {
      min-width: 0;
      flex: 1;

      padding: 14px 13px;

      background: transparent;
      border: none;
      outline: none;

      color: #fff;
      font-size: 14px;
      border-radius: 11px;
    }

    .input-container input::placeholder {
      color: #69716f;
    }

    .input-container button {
      flex: 0 0 auto;

      padding: 0 17px;
      border: none;
      border-radius: 11px;

      background: linear-gradient(135deg, #00e5a0, #00b7ff);
      color: #04110c;

      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      cursor: pointer;

      transition: all 0.2s ease;

      box-shadow:
        0 5px 18px rgba(0, 229, 160, 0.18);
    }

    .input-container button:hover {
      transform: translateY(-1px);
      filter: brightness(1.08);
      box-shadow:
        0 8px 25px rgba(0, 229, 160, 0.28);
    }

    .input-container button:active {
      transform: scale(0.97);
    }

    #loading-spinner {
      display: none;
      margin-top: 20px;
      color: #00e5a0;
      font-size: 14px;
    }

    #loading-spinner .fa-spinner {
      animation: spin 1s linear infinite;
    }

    #pair {
      min-height: 35px;
      margin-top: 18px;
    }

    #copy {
      display: inline-block;
      padding: 13px 20px;

      color: #00e5a0 !important;
      background: rgba(0, 229, 160, 0.07);

      border: 1px solid rgba(0, 229, 160, 0.25);
      border-radius: 12px;

      font-size: 19px !important;
      font-weight: 800;

      cursor: pointer;
      transition: 0.2s ease;
    }

    #copy span {
      color: #fff !important;
      letter-spacing: 2px;
    }

    #copy:hover {
      background: rgba(0, 229, 160, 0.12);
      transform: translateY(-2px);
    }

    .footer {
      margin-top: 23px;
      color: #555d5a;
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 500px) {
      body {
        padding: 15px;
      }

      .box {
        padding: 28px 18px 24px;
        border-radius: 21px;
      }

      .brand {
        font-size: 25px;
      }

      .centered-text {
        font-size: 19px;
      }

      .input-container {
        flex-direction: column;
      }

      .input-container input {
        width: 100%;
        padding: 15px 13px;
      }

      .input-container button {
        width: 100%;
        min-height: 48px;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="box" id="box">

      <div class="brand-icon">
        <i class="fas fa-link"></i>
      </div>

      <h1 class="brand">XIBU-MD</h1>

      <p class="subtitle">WhatsApp Pairing System</p>

      <h3 class="centered-text">
        Link Xibu-md with phone number
      </h3>

      <p class="description">
        🔢 Enter your WhatsApp number with country code
        to generate your pairing code.
      </p>

      <div class="input-container">
        <input
          placeholder="+94704xxxxxx"
          type="number"
          id="number"
          name=""
        >

        <button id="submit">
          SUBMIT
        </button>
      </div>

      <div id="loading-spinner">
        <i class="fas fa-spinner fa-spin"></i>
        <span> Generating code...</span>
      </div>

      <main id="pair"></main>

      <div class="footer">
        Xibu-md • Secure Pairing
      </div>

    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.0.0-alpha.1/axios.min.js"></script>

  <script>

    let a = document.getElementById("pair");
    let b = document.getElementById("submit");
    let c = document.getElementById("number");
    let box = document.getElementById("box");

    async function Copy() {
      let text = document.getElementById("copy").innerText;
      let obj = document.getElementById("copy");

      await navigator.clipboard.writeText(
        obj.innerText.replace('CODE: ', '')
      );

      obj.innerText = "✔️ COPIED";
      obj.style = "color:#00e5a0;font-weight:bold";

      setTimeout(() => {
        obj.innerText = text;
        obj.style = "color:#00e5a0;font-weight:bold";
      }, 500);
    }

    b.addEventListener("click", async (e) => {

      e.preventDefault();

      if (!c.value) {

        a.innerHTML =
          '<a style="color:#ff6b6b;font-weight:bold">' +
          '❗ Enter your WhatsApp number with country code.' +
          '</a>';

      } else if (
        c.value.replace(/[^0-9]/g, "").length < 11
      ) {

        a.innerHTML =
          '<a style="color:#ff6b6b;font-weight:bold">' +
          '❗ Invalid number format. Please try again.' +
          '</a>';

      } else {

        const bc = c.value.replace(/[^0-9]/g, "");

        let bb = "";
        let bbc = "";

        const cc = bc.split('');

        cc.map(a => {

          bbc += a;

          if (bbc.length == 3) {
            bb += " " + a;
          } else if (bbc.length == 8) {
            bb += " " + a;
          } else {
            bb += a;
          }

        });

        c.type = "text";
        c.value = "+" + bb;
        c.style = "color:white;font-size:20px";

        document.getElementById(
          "loading-spinner"
        ).style.display = "block";

        a.innerHTML = '';

        let { data } = await axios(
          `/code?number=${bc}`
        );

        let code =
          data.code || "❗ Service Unavailable";

        a.innerHTML =
          '<font id="copy" onclick="Copy()" ' +
          'style="color:#00e5a0;font-weight:bold" size="5">' +
          'CODE: <span>' + code + '</span>' +
          '</font>';

        document.getElementById(
          "loading-spinner"
        ).style.display = "none";
      }

    });

  </script>

</body>
</html>
